upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/x-bibtex;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Behind a TLS-terminating proxy keep its value; otherwise use our scheme.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # API, Django admin and the admin's static files are served by Django.
    location /api/ {
        proxy_pass http://backend;
        proxy_read_timeout 130s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /admin/ {
        proxy_pass http://backend;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: unknown paths serve index.html (client-side routing).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

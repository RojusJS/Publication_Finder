name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: publication_finder
          POSTGRES_USER: publication_finder
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U publication_finder"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Migrations are complete
        env:
          DJANGO_DEBUG: "true"
          DB_ENGINE: sqlite
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply on PostgreSQL
        env:
          DJANGO_DEBUG: "true"
          DB_ENGINE: postgresql
          DB_HOST: localhost
          DB_NAME: publication_finder
          DB_USER: publication_finder
          DB_PASSWORD: ci-password
        run: python manage.py migrate --noinput
      - name: Production settings check
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.org
          DB_ENGINE: sqlite
        run: python manage.py check --deploy --fail-level ERROR

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
